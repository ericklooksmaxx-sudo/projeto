### termux-plus — ~/.termux/termux.properties
### Aplique com: termux-reload-settings

# Duas linhas de teclas extras: navegação + símbolos comuns em programação.
# Deslize para a esquerda na barra para abrir o campo de texto completo.
extra-keys = [ \
 ['ESC', {key: '/', popup: '\\'}, {key: '-', popup: '|'}, 'HOME', 'UP', 'END', 'PGUP', {key: 'BKSP', popup: 'DEL'}], \
 ['TAB', 'CTRL', 'ALT', 'LEFT', 'DOWN', 'RIGHT', 'PGDN', {key: 'KEYBOARD', popup: 'DRAWER'}] \
]
extra-keys-style = rounded

# Teclas de volume controlam o volume (não viram Ctrl/Fn).
volume-keys = volume

# Cursor em barra que pisca (mais fácil de achar em telas pequenas).
terminal-cursor-style = bar
terminal-cursor-blink-rate = 600

# Mais histórico de rolagem.
terminal-transcript-rows = 5000

# Vibração em vez de som no "bell".
bell-character = vibrate

# Abrir links ao tocar neles.
terminal-onclick-url-open = true

# SEGURANÇA: não permitir que outros apps rodem comandos no Termux.
# Mude para true SOMENTE se usa Tasker/Termux:Widget de terceiros e confia neles.
allow-external-apps = false
