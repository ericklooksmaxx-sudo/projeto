      const chipIn = (id, at) => tl.fromTo(id, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "expo.out" }, at);

      // Start state: only ADDONS visible.

      descIn("#c-a-desc", 0.3);

      tl.set("#c-A", { opacity: 0 }, T + 0.03);

      // ---- 02 TEXTURAS: three packs, three directions.
      tl.set("#c-T", { opacity: 1 }, T - 0.06);

      descDots("#c-t-desc", T + B);

      // ---- 03 MUNDOS: iris from the centre, the word rolls like a slot machine.
      tl.set("#c-M", { opacity: 1 }, M - 0.05);
      tl.fromTo("#c-M", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)", duration: 0.24, ease: "power2.out" }, M - 0.05);
      tl.set("#c-T", { opacity: 0 }, M + 0.2);
      tl.fromTo("#c-m-bg", { scale: 1.32 }, { scale: 1.04, duration: BAR, ease: "power4.out" }, M - 0.05);

      chipIn("#c-m-chip", M + 0.2);
      descIn("#c-m-desc", M + B);
      descDots("#c-m-desc", M + B);

      tl.fromTo("#c-s-c1", { y: 760, rotation: -14 }, { y: 0, rotation: -5, duration: 0.55, ease: "back.out(1.3)" }, S + 0.02);
