  <div id="root" data-composition-id="skinwall" data-width="1920" data-height="1080">

    <div id="w-ghost" data-layout-ignore>SKINS</div>
    <div id="w-cam" data-layout-allow-overlap>
      <div id="w-label">PACKS DE SKINS</div>
      <div id="w-c1" class="w-card" style="left: 56px; top: 278px"><img src="assets/skins/k1.jpg" alt="" /></div>
      <div id="w-c2" class="w-card" style="left: 512px; top: 278px"><img src="assets/skins/k2.jpg" alt="" /></div>

  <script>
    (function () {
      const B = 60 / 128, BAR = B * 4, LAND = B;
      const tl = gsap.timeline({ paused: true });

      // Silence: the pixel winds up, then the hit.
      tl.fromTo("#w-pix", { scale: 1.6, rotation: 45, opacity: 1 }, { scale: 0.4, rotation: 0, duration: LAND - 0.02, ease: "power2.in" }, 0);
      tl.set("#w-pix", { opacity: 0 }, LAND);
      tl.fromTo("#w-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, LAND);
      tl.fromTo("#w-glow", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, LAND);
      tl.fromTo("#w-ghost", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, LAND);
      tl.fromTo("#w-label", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, LAND + 0.05);

      // Eight real skin packs slam in, one per 8th note; the camera pushes in.
      tl.fromTo("#w-cam", { scale: 1 }, { scale: 1.07, duration: BAR + 0.3, ease: "power1.inOut" }, LAND);
      const order = [1, 6, 3, 8, 2, 5, 7, 4];
      order.forEach((n, i) => {
        const at = LAND + i * (B / 2);
        tl.fromTo("#w-c" + n, { opacity: 0, scale: 1.7, filter: "blur(14px)", rotation: i % 2 ? 6 : -6 },
          { opacity: 1, scale: 1, filter: "blur(0px)", rotation: 0, duration: 0.26, ease: "expo.out" }, at);
        tl.fromTo("#w-cam", { x: i % 2 ? 10 : -10 }, { x: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
      });

      // One pack becomes the world.
      const ZOOM = LAND + BAR;
      tl.to(["#w-label", "#w-ghost"], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, ZOOM - 0.05);
      [1, 3, 4, 5, 6, 7, 8].forEach((n) => tl.to("#w-c" + n, { opacity: 0, filter: "blur(15px)", duration: 0.3, ease: "power2.in" }, ZOOM));
      tl.to("#w-c2", { x: 960 - (512 + 220), y: 540 - (278 + 124), scale: 4.4, borderRadius: 0, duration: 0.55, ease: "power2.inOut" }, ZOOM);
      tl.set("#w-big", { opacity: 1 }, ZOOM + 0.5);
      tl.set("#w-b1", { opacity: 1 }, ZOOM + 0.5);
      tl.set("#w-cam", { opacity: 0 }, ZOOM + 0.56);
      tl.fromTo("#w-b1", { scale: 1.06 }, { scale: 1.0, duration: 0.6, ease: "power2.out" }, ZOOM + 0.5);
      tl.fromTo("#w-line span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.08 }, ZOOM + 0.52);
      // Two more packs cut in on the beats, the line stays put.
      const c1 = LAND + BAR + B * 3, c2 = LAND + BAR + B * 3.5;
      tl.set("#w-b2", { opacity: 1 }, c1);
      tl.fromTo("#w-b2", { scale: 1.15 }, { scale: 1.02, duration: B / 2, ease: "power2.out" }, c1);
      tl.set("#w-b3", { opacity: 1 }, c2);
      tl.fromTo("#w-b3", { scale: 1.15 }, { scale: 1.02, duration: B / 2, ease: "power2.out" }, c2);
      tl.fromTo("#w-flash", { opacity: 0.5 }, { opacity: 0, duration: 0.12, immediateRender: false }, c1);
      tl.fromTo("#w-flash", { opacity: 0.5 }, { opacity: 0, duration: 0.12, immediateRender: false }, c2);

      window.__timelines["skinwall"] = tl;
    })();
  </script>
