  <script>
    (function () {
      const B = 60 / 128;
      const LAND = B; // the 22.5 s hit, one beat after this scene starts in the silence
      const END = 7.97;
      const tl = gsap.timeline({ paused: true });
      let s = 11;
      const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };

      // Ambient: grid drifts, motes rise. Background only.
      tl.fromTo("#e-grid", { opacity: 0, backgroundPosition: "0px 0px" }, { opacity: 1, backgroundPosition: "0px -240px", duration: END, ease: "none" }, 0);
      tl.fromTo("#e-bg", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, LAND);
      const motes = document.getElementById("e-motes");
      for (let i = 0; i < 16; i++) {
        const m = document.createElement("div"), z = Math.round(6 + rnd() * 12);
        m.className = "e-mote"; m.id = "e-m" + i;
        m.style.width = z + "px"; m.style.height = z + "px";
        m.style.left = Math.round(120 + rnd() * 1680) + "px"; m.style.top = Math.round(200 + rnd() * 820) + "px";
        motes.appendChild(m);
        tl.fromTo(m, { y: 0, opacity: 0 }, { y: -(80 + rnd() * 160), opacity: 0.25 + rnd() * 0.4, duration: END - LAND, ease: "none" }, LAND);
      }

      // The fox assembles out of scattered pixels during the silence and lands on the hit.
      document.querySelectorAll("#e-foxpx .e-px").forEach((p) => {
        const a = rnd() * Math.PI * 2, r = 380 + rnd() * 700, st = rnd() * 0.12;
        tl.fromTo(p, { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.7, rotation: (rnd() - 0.5) * 300, scale: 0.3 },
          { x: 0, y: 0, rotation: 0, scale: 1, duration: LAND - st, ease: "power3.in" }, st);
        tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, st);
      });
      tl.fromTo("#e-foxglow", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, LAND);
      tl.fromTo("#e-fox", { scale: 1.22 }, { scale: 1, duration: 0.4, ease: "expo.out" }, LAND);
      tl.fromTo("#e-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, LAND);
      tl.fromTo("#e-ring", { scale: 0.3, opacity: 1 }, { scale: 3.8, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, LAND);

      // Lockup: fox slides left, wordmark wipes in beside it (bar 2 of the end card).
      const LOCK = LAND + B * 2;
      tl.to("#e-fox", { x: -310, duration: 0.55, ease: "power3.inOut" }, LOCK);
      tl.fromTo("#e-word", { clipPath: "inset(0% 100% 0% 0%)", filter: "blur(10px)", x: -40 },
        { clipPath: "inset(0% 0% 0% 0%)", filter: "blur(0px)", x: 0, duration: 0.5, ease: "power3.out" }, LOCK + 0.18);

      // Tagline: word by word, grey to ink.
      const TAG = LAND + B * 4;
      tl.fromTo("#e-tag span", { opacity: 0, color: "#5a5466" }, { opacity: 1, color: "#f2f0f5", duration: 0.16, ease: "power2.out", stagger: 0.08 }, TAG);
      tl.fromTo("#e-tag .hot", { color: "#5a5466" }, { color: "#bb92ff", duration: 0.16, ease: "power2.out" }, TAG + 0.48);

      // CTA: the pill morphs open from a dot, then its text lands.
      const CTA = LAND + B * 6;
      tl.fromTo("#e-cta", { clipPath: "inset(0px 284px 0px 284px round 999px)", opacity: 0 },
        { clipPath: "inset(0px 0px 0px 0px round 999px)", opacity: 1, duration: 0.4, ease: "power3.out" }, CTA);
      tl.fromTo(["#e-cta-a", "#e-cta-arrow", "#e-cta-b"], { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 }, CTA + 0.22);

      // Out to black under the music fade.
      tl.fromTo("#e-black", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.in" }, END - 0.52);

      window.__timelines["end"] = tl;
    })();
