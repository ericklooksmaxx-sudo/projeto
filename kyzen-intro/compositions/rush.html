  <script>
    (function () {
      const B = 60 / 128, E = B / 2;
      const tl = gsap.timeline({ paused: true });

      // A real shot on every 8th note, each one punched in.
      for (let i = 0; i < 16; i++) {
        const at = i * E, id = "#r-i" + (i + 1);
        tl.set(id, { opacity: 1 }, at);
        tl.fromTo(id, { scale: 1.2 }, { scale: 1.03, duration: E, ease: "power3.out" }, at);
        if (i < 15) tl.set(id, { opacity: 0 }, at + E);
        // Glitch on every other cut: frame jitter + white slices.
        if (i % 2 === 1) {
          const s = i % 4 === 1 ? 1 : -1;
          tl.set("#r-stage", { x: 34 * s }, at);
          tl.set("#r-stage", { x: 0 }, at + 0.067);
          tl.set("#r-b" + (1 + (i % 3)), { opacity: 1 }, at);
          tl.set("#r-b" + (1 + (i % 3)), { opacity: 0 }, at + 0.067);
        }
      }
      // Purple colour hits on the half bars.
      [0, 4, 8, 12].forEach((k) => tl.fromTo("#r-tint", { opacity: 0.75 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, k * E));

      // Four verbs, two beats each, four different entrances.
      tl.fromTo("#r-w1", { opacity: 0, scale: 2.2, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, 0);
      tl.set("#r-w1", { opacity: 0 }, B * 2);
      tl.set("#r-w2", { opacity: 1 }, B * 2);
      tl.fromTo("#r-w2 span", { opacity: 0, y: -60, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.16, ease: "expo.out", stagger: 0.03 }, B * 2);
      tl.set("#r-w2", { opacity: 0 }, B * 4);
      tl.fromTo("#r-w3", { opacity: 0, x: 900, filter: "blur(24px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, B * 4);
      tl.set("#r-w3", { opacity: 0 }, B * 6);
      tl.fromTo("#r-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, B * 6);
      tl.fromTo("#r-w4", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, B * 6 + 0.08);
      tl.fromTo("#r-flash", { opacity: 0.6 }, { opacity: 0, duration: 0.14, ease: "power2.out", immediateRender: false }, B * 6);

      // Out on the gap: everything snaps to white.
      tl.to("#r-flash", { opacity: 1, duration: 0.12, ease: "power2.in" }, B * 8 - 0.12);

      window.__timelines["rush"] = tl;
    })();
