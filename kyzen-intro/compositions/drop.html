<template>
  <style>
    @font-face { font-family: "Work Sans"; font-weight: 700; src: url("assets/fonts/work-sans-latin-700-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; }
    #d-grid { position: absolute; inset: -120px;
      background-image: linear-gradient(rgba(138,63,240,0.16) 2px, transparent 2px), linear-gradient(90deg, rgba(138,63,240,0.16) 2px, transparent 2px);
      background-size: 60px 60px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 0%, rgba(0,0,0,0.5) 35%, transparent 70%);
      mask-image: radial-gradient(ellipse at 50% 50%, #000 0%, rgba(0,0,0,0.5) 35%, transparent 70%); }
    #d-glow { position: absolute; left: 160px; top: -260px; width: 1600px; height: 1600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(138,63,240,0.75) 0%, rgba(111,14,207,0.35) 30%, rgba(46,6,89,0.15) 50%, rgba(0,0,0,0) 68%); }
    #d-ring { position: absolute; left: 760px; top: 340px; width: 400px; height: 400px; border-radius: 50%;
      border: 8px solid #bb92ff; box-shadow: 0 0 40px rgba(187,146,255,0.8), inset 0 0 40px rgba(187,146,255,0.6); }
    .d-ln { position: absolute; left: 960px; top: 538px; height: 4px; width: 420px; transform-origin: 0% 50%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 35%, #e9dbff 70%, rgba(255,255,255,0) 100%); }
    .d-p { position: absolute; left: 960px; top: 520px; }
    #d-cam { position: absolute; inset: 0; }
    #d-logo-wrap { position: absolute; left: 420px; top: 150px; width: 1080px; height: 728px; }
    .d-logo { position: absolute; left: 0; top: 0; width: 1080px; height: 728px; }
    .d-tint { -webkit-mask: url("assets/brand/kyzen-wordmark.png") center / contain no-repeat;
      mask: url("assets/brand/kyzen-wordmark.png") center / contain no-repeat; mix-blend-mode: screen; opacity: 0; }
    #d-logo-r { background: #ff2bd6; }
    #d-logo-c { background: #2be8ff; }
    #d-sub { position: absolute; left: 0; top: 880px; width: 1920px; text-align: center;
      font-family: "Work Sans", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 0.36em; color: #f2f0f5; }
    #d-sub span { display: inline-block; }
    #d-sub .dot { color: #8a3ff0; margin: 0 22px 0 4px; }
    #d-flash { position: absolute; inset: 0; background: #fff; }
    #d-white { position: absolute; inset: 0; background: #fff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="drop" data-width="1920" data-height="1080">
    <div id="d-grid" data-layout-ignore></div>
    <div id="d-glow" data-layout-ignore></div>
    <div id="d-ring" data-layout-ignore></div>
    <div id="d-lines" data-layout-ignore></div>
    <div id="d-parts" data-layout-ignore></div>
    <div id="d-cam">
      <div id="d-logo-wrap" data-layout-allow-overlap>
        <div id="d-logo-r" class="d-logo d-tint"></div>
        <div id="d-logo-c" class="d-logo d-tint"></div>
        <img id="d-logo" class="d-logo" src="assets/brand/kyzen-wordmark.png" alt="KYZEN" />
      </div>
      <div id="d-sub"><span id="d-w1">ADDONS</span><span class="dot" id="d-o1">·</span><span id="d-w2">TEXTURAS</span><span class="dot" id="d-o2">·</span><span id="d-w3">MUNDOS</span><span class="dot" id="d-o3">·</span><span id="d-w4">SKINS</span></div>
    </div>
    <div id="d-flash"></div>
    <div id="d-white"></div>
  </div>
  <script>
    (function () {
      const B = 60 / 128, BAR = B * 4;
      const tl = gsap.timeline({ paused: true });

      // Seeded pixel burst (deterministic).
      let s = 7;
      const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      const parts = document.getElementById("d-parts");
      const cols = ["#8a3ff0", "#bb92ff", "#6f0ecf", "#f2f0f5", "#a06bfb"];
      for (let i = 0; i < 26; i++) {
        const el = document.createElement("div");
        const z = Math.round(10 + rnd() * 26);
        el.className = "d-p"; el.id = "d-p" + i;
        el.style.width = z + "px"; el.style.height = z + "px"; el.style.background = cols[i % cols.length];
        parts.appendChild(el);
        const a = (i / 26) * Math.PI * 2 + rnd() * 0.3, r = 420 + rnd() * 620;
        tl.fromTo(el, { x: 0, y: 0, rotation: 0, opacity: 1, scale: 1 },
          { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.75, rotation: (rnd() - 0.5) * 360, opacity: 0, scale: 0.4,
            duration: 0.9 + rnd() * 0.4, ease: "expo.out" }, 0);
      }

      // Speed lines burst from the centre.
      const lines = document.getElementById("d-lines");
      for (let i = 0; i < 32; i++) {
        const el = document.createElement("div");
        el.className = "d-ln"; el.id = "d-ln" + i;
        lines.appendChild(el);
        const ang = (i / 32) * 360 + rnd() * 6;
        tl.fromTo(el, { rotation: ang, x: 0, scaleX: 0.2, opacity: 1 },
          { rotation: ang, x: 0, scaleX: 1.6 + rnd() * 1.4, opacity: 0, duration: 0.45 + rnd() * 0.25, ease: "expo.out" }, 0);
      }

      // The slam.
      tl.fromTo("#d-flash", { opacity: 1 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 0);
      tl.fromTo("#d-logo-wrap", { scale: 2.3, filter: "blur(26px)" }, { scale: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 0);
      tl.fromTo("#d-cam", { x: 0, y: 0 }, { keyframes: [
        { x: -22, y: 12, duration: 0.04 }, { x: 18, y: -10, duration: 0.04 }, { x: -12, y: 7, duration: 0.05 },
        { x: 8, y: -4, duration: 0.05 }, { x: -4, y: 2, duration: 0.06 }, { x: 0, y: 0, duration: 0.07 } ] }, 0.02);
      tl.fromTo("#d-glow", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "expo.out" }, 0);
      tl.fromTo("#d-ring", { scale: 0.2, opacity: 1 }, { scale: 4.2, opacity: 0, duration: 0.75, ease: "power2.out" }, 0);
      tl.fromTo("#d-grid", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0);
      tl.fromTo("#d-grid", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 180px", duration: 3.75, ease: "none" }, 0);

      // Chromatic split on the hit and on the next bar.
      const chroma = (at, d) => {
        tl.fromTo("#d-logo-r", { opacity: 0.85, x: d }, { opacity: 0, x: 0, duration: 0.3, ease: "power3.out" }, at);
        tl.fromTo("#d-logo-c", { opacity: 0.85, x: -d }, { opacity: 0, x: 0, duration: 0.3, ease: "power3.out" }, at);
      };
      chroma(0, 26);
      chroma(BAR, 16);
      tl.fromTo("#d-glow", { scale: 1.12 }, { scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, BAR);

      // Category words land one per beat.
      tl.set(["#d-o1", "#d-o2", "#d-o3"], { opacity: 0 }, 0);
      ["#d-w1", "#d-w2", "#d-w3", "#d-w4"].forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" }, B * (i + 1));
        if (i) tl.set("#d-o" + i, { opacity: 1 }, B * (i + 1));
      });

      // Zoom through the wordmark into white.
      tl.to("#d-sub", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 3.3);
      tl.to("#d-logo-wrap", { scale: 9, filter: "blur(14px)", duration: 0.36, ease: "power3.in" }, 3.39);
      tl.to("#d-white", { opacity: 1, duration: 0.14, ease: "power2.in" }, 3.6);

      window.__timelines["drop"] = tl;
    })();
  </script>
</template>
