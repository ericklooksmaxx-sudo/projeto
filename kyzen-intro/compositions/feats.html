    (function () {
      const B = 60 / 128;
      const tl = gsap.timeline({ paused: true });

      // Each feature: icon pops on a spring, the title wipes, the line blurs in.
      const panel = (k, at) => {
        tl.fromTo("#f-i" + k, { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.34, ease: "back.out(2.2)" }, at);

      };
      panel(1, 0);
      tl.fromTo("#f-foot", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);

      // The stack pushes up a screen, landing on every second beat.
      [1, 2, 3].forEach((k) => {
        const at = B * 2 * k;
        tl.to("#f-stack", { y: -1080 * k, duration: 0.32, ease: "power4.inOut" }, at - 0.22);

      });

      tl.set("#f-foot", { color: "#450884" }, B * 6 - 0.05);

      // Iris closes to black on the last beat.
